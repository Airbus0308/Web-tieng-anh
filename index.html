<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IELTS Placement Test — Assess your English proficiency level with 15 Reading and Listening questions. Get your estimated IELTS band score instantly.">
  <title>IELTS Master — Placement Test</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/main.css">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='70' font-size='55' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>IM</text></svg>">
</head>
<body>

  <!-- ── Header ─────────────────────────────────────── -->
  <header class="app-header" id="app-header">
    <a class="logo" href="index.html">
      <div class="logo-icon">IM</div>
      <div class="logo-text">IELTS <span>Master</span></div>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link active">Placement Test</a>
      <a href="writing.html" class="nav-link">Writing Practice</a>
      <a href="speaking.html" class="nav-link">Speaking Practice</a>
      <a href="study.html" class="nav-link">Study Hub</a>
      <a href="analytics.html" class="nav-link">Analytics</a>
    </nav>
    <div class="header-right">
      <div class="timer-area" id="timer-area">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="timer-display">00:00</span>
      </div>
    </div>
  </header>

  <!-- ── Progress Bar ───────────────────────────────── -->
  <div class="progress-bar" id="progress-bar">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="progress-text" id="progress-text">0 / 15 answered</span>
  </div>

  <!-- ── Main Content ───────────────────────────────── -->
  <main class="main-container">
    <div id="test-content">
      <!-- Dynamic content rendered by JS modules -->
    </div>
  </main>

  <!-- ── Scripts (order matters: dependencies first) ─ -->
  <script src="js/questions.js"></script>
  <script src="js/database.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script src="js/api-keys.js"></script>
  <script src="js/exam-security.js"></script>
</body>
</html>
